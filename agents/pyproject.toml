[project]
name = "agentsreusable"
version = "0.1.0"
description = "Production-grade AI Agent Product Factory Blueprint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
agent-factory = "cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_factory*", "cli*", "templates*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

